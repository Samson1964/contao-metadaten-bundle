# Quelle für die Metadaten im Contao Manager (contao/package-metadata).
# Änderungen hier werden von Claude in den Fork übertragen.
# Der englische Block wird beim Abgleich ergänzt, falls er fehlt.
#
# Die Rechtschreibprüfung des Linters kennt viele zusammengesetzte Wörter
# nicht und prüft nur title und description. Deshalb stehen dort Umschreibungen
# („alternativer Text“ statt „Alternativtext“), die Fachwörter in den keywords.

de:
    title: Metadaten
    description: >
        Backend-Modul, das die Metadaten vieler Dateien aus der Dateiverwaltung auf einmal bearbeitet: Titel, alternativer Text, Link, Beschriftung und Lizenz lassen sich suchen und ersetzen oder mit festen Werten setzen — für alle Dateien oder für einen Ordner mit allem, was darunter liegt.

        Eine Vorschau zeigt jede Änderung vor dem Speichern, und jede geänderte Datei erhält eine neue Version.

        Für Bilder ohne wichtigen Teil gibt es einen eigenen Editor: Er erkennt Gesichter direkt im Browser, schlägt den Ausschnitt um die Köpfe vor und lässt ihn mit der Maus anpassen.
    keywords:
        - Metadaten
        - Dateiverwaltung
        - Bildunterschrift
        - Alternativtext
        - Suchen und Ersetzen
        - wichtiger Bildteil
        - Gesichtserkennung

en:
    title: Metadata
    description: >
        Back end module that edits the metadata of many files from the file manager at once: title, alternative text, link, caption and license can be searched and replaced or set to fixed values — for all files or for a folder and everything below it.

        A preview shows every change before it is saved, and every changed file gets a new version.

        Images without an important part get their own editor: it detects faces right in the browser, suggests the section around the heads and lets you adjust it with the mouse.
    keywords:
        - metadata
        - file manager
        - caption
        - alternative text
        - search and replace
        - important part
        - face detection
